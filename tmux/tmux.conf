#  =============================================================================
# 🖥️  Tmux Configuration for Enhanced Productivity
# =============================================================================

# =============================================================================
# 🔌 TPM (Tmux Plugin Manager) Configuration
# =============================================================================
source-file ~/.config/tmux/tmux.reset.conf
unbind r
bind r source-file ~/.tmux.conf

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'jaclu/tmux-menus'

# bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"


# SessionX plugin configuration
set -g @sessionx_bind 'O'
set -g @sessionx-window-mode 'on'
set -g @sessionx-tree-mode 'on'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'

# Catppuccin theme configuration
set -g @catppuccin_flavour 'mocha' # latte, frappe, macchiato, mocha
run '~/.tmux/plugins/tmux/catppuccin.tmux'

set -g @catppuccin_status_fill "icon"
set -g @catppuccin_directory_text "#{pane_current_path}"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_2}"
set -g @catppuccin_pane_active_border_style "##{?pane_in_mode,fg=#{@thm_peach},##{?pane_synchronized,fg=#{@thm_mauve},fg=#{@thm_lavender}}}"
set -g @catppuccin_session_text " #S • #{b:pane_current_path}"

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"

# set -g @catppuccin_window_status_style "rounded"

# set -g status-left-length 100
# set -g status-left ""
# set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
# set -ag status-right "#{E:@catppuccin_status_session}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"
# set -agF status-right "#{E:@catppuccin_status_battery}"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %d-%m-%Y 󰅐 %H:%M "

# =============================================================================
# 🎨 General Settings
# =============================================================================

# Enable mouse support
set -g mouse on

set-option -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"
# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

# " ●" appears when a Claude session in the window needs input (set by ~/.claude/hooks/tmux-attention.sh)
set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,}#{?#{P:#{?@claude_attention,1,}}, ●,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,}#{?#{P:#{?@claude_attention,1,}}, ●,} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"


# Set default terminal mode to 256color mode
set -g default-terminal "screen-256color"

# Additional terminal compatibility for pane content preservation
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",alacritty:Tc"
set -ga terminal-overrides ",kitty:Tc"
set -ga terminal-overrides ",iTerm2:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -ga terminal-features ",xterm-ghostty:RGB"

# Increase scrollback buffer size
set -g history-limit 1000000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows sequentially after closing any of them
set -g renumber-windows on

set -g @menus_trigger 'q'

# =============================================================================
# ⌨️  Key Bindings
# =============================================================================

# Change prefix key to Ctrl+s (easier to reach than Ctrl+b)
set -g prefix C-s
unbind C-b
bind C-s send-prefix

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Close the current pane with Ctrl+s then x
bind x kill-pane

# Vim-like pane navigation (Ctrl+s + vim keys)
bind j select-pane -D
bind k select-pane -U
bind h select-pane -L
bind l select-pane -R

# Resize panes using Ctrl+arrow
bind -n C-Left resize-pane -L 5
bind -n C-Right resize-pane -R 5
bind -n C-Up resize-pane -U 5
bind -n C-Down resize-pane -D 5


# Switch panes using 
# =============================================================================
# 🔧 Advanced Features
# =============================================================================

# Automatically set window title
setw -g automatic-rename on
set -g renumber-windows on

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# =============================================================================
# 🚀 Productivity Enhancements
# =============================================================================

# Quick session switching
bind s choose-session

# Quick window switching
bind W choose-window

# Copy mode improvements
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi r send -X rectangle-toggle

# =============================================================================
# 🎯 Development-Friendly Settings
# =============================================================================

# Allow terminal to handle colors properly
set -ga terminal-overrides ",*256col*:Tc"

# Faster key repetition
set -s escape-time 0

# Focus events enabled for terminals that support them
set -g focus-events on

# Fix pane content disappearing when switching
set -g aggressive-resize on
set -g assume-paste-time 1
set -g detach-on-destroy off
set -g display-panes-time 2000
set -g display-time 2000
set -g repeat-time 600
set -g set-titles on
set -g set-titles-string " "
set -g status-interval 1
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g word-separators " -_@"

# =============================================================================
# 📝 Session Management
# =============================================================================

# Resurrect plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'

# =============================================================================
# 🎨 Color Scheme (Handled by Catppuccin theme)
# =============================================================================

# Old color scheme commented out - Catppuccin handles all colors
# set -g pane-border-style fg=colour235
# set -g pane-active-border-style fg=colour136
# set -g message-style bg=colour235,fg=colour166
# set -g display-panes-active-colour colour33
# set -g display-panes-colour colour166
# setw -g clock-mode-colour colour33

# =============================================================================
# 🔌 TPM Initialization (MUST be at the very bottom)
# =============================================================================

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
